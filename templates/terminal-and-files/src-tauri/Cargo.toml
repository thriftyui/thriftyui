[package]
name = "terminal-and-files"
version = "0.1.0"
description = "Terminal and files: a project's files and Claude Code, side by side"
authors = ["ThriftyUI"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "terminal_and_files_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
portable-pty = "0.9.0"
tauri-plugin-dialog = "2.8.3"
notify = "8"
